<div class="row g-3 align-items-end mb-3">
  <div class="col-md-7">
    <app-generic-selector
      [data]="items()"
      valueField="Id"
      textField="Name"
      mode="single"
      [label]="'Choose item' | t"
      [placeholder]="'Choose item' | t"
      [initialSelection]="selectedItemId"
      (selectionChanged)="selectedItemId = $event?.Id ?? null"
    ></app-generic-selector>
  </div>
  <div class="col-7 col-md-3">
    <label for="item-quantity" class="form-label">{{ "Quantity" | t }}</label>
    <input
      id="item-quantity"
      class="form-control"
      type="number"
      min="1"
      step="1"
      [(ngModel)]="quantity"
      [ngModelOptions]="{ standalone: true }"
    />
  </div>
  <div class="col-5 col-md-2">
    <button
      type="button"
      class="btn btn-primary w-100"
      (click)="addItem()"
      [disabled]="!selectedItemId || quantity < 1"
    >
      {{ "Add" | t }}
    </button>
  </div>
</div>
<app-generic-grid
  [data]="rows"
  [columns]="columns"
  [actions]="actions"
  [rowId]="rowId"
  [selectable]="false"
  [label]="'Items on this visit' | t"
  emptyMessage="No items added yet."
></app-generic-grid>
