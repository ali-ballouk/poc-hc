<div class="row g-3">
  <div class="col-md-6">
    <label for="card-last-four" class="form-label">{{
      "Last 4 digits" | t
    }}</label
    ><input
      id="card-last-four"
      type="text"
      class="form-control"
      [(ngModel)]="cardNumberLast4"
      maxlength="4"
      inputmode="numeric"
    />
  </div>
  <div class="col-md-6">
    <label for="card-token" class="form-label">{{ "Token" | t }}</label
    ><input
      id="card-token"
      type="text"
      class="form-control"
      [(ngModel)]="token"
    />
  </div>
  <div class="col-md-6">
    <label for="card-expiry" class="form-label">{{ "Expiry date" | t }}</label
    ><input
      id="card-expiry"
      type="month"
      class="form-control"
      [(ngModel)]="expiryDate"
    />
  </div>
</div>
