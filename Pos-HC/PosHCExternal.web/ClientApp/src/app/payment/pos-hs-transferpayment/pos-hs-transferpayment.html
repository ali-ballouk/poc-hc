<div class="row g-3">
  <div class="col-md-6">
    <label for="transfer-bank" class="form-label">{{ "Bank" | t }}</label
    ><input
      id="transfer-bank"
      type="text"
      class="form-control"
      [(ngModel)]="banke"
    />
  </div>
  <div class="col-md-6">
    <label for="transfer-reference" class="form-label">{{
      "Reference number" | t
    }}</label
    ><input
      id="transfer-reference"
      type="text"
      class="form-control"
      [(ngModel)]="referenceNumber"
    />
  </div>
</div>
