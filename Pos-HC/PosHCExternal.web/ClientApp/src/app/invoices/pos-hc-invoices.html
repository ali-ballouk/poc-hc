<h1 class="h3 mb-4">Invoices</h1>
@if (downloadError) {
  <div class="alert alert-danger" role="alert">{{ downloadError }}</div>
}
<app-generic-grid
  [data]="rows"
  [actions]="actions"
  [rowId]="rowId"
  [selectable]="false"
  [loading]="loading"
  label="Clinic invoices"
  emptyMessage="No invoices to display."
>
  <app-generic-grid-column
    key="InvoiceId"
    header="Invoice"
    [widthPx]="310"
  ></app-generic-grid-column>
  <app-generic-grid-column
    key="InvoiceDate"
    header="Date"
    type="date"
    [widthPx]="190"
  >
    <ng-template let-invoice>{{
      invoice.InvoiceDate | date: "yyyy-MM-dd HH:mm"
    }}</ng-template>
  </app-generic-grid-column>
  <app-generic-grid-column
    key="DoctorName"
    header="Doctor"
  ></app-generic-grid-column>
  <app-generic-grid-column
    key="PatientName"
    header="Patient"
  ></app-generic-grid-column>
  <app-generic-grid-column
    key="DoctorFee"
    header="Doctor fee"
    type="currency"
    [widthPx]="130"
  ></app-generic-grid-column>
  <app-generic-grid-column
    key="Discount"
    header="Discount"
    type="currency"
    [widthPx]="120"
  ></app-generic-grid-column>
  <app-generic-grid-column
    key="Total"
    header="Total"
    type="currency"
    [widthPx]="120"
  ></app-generic-grid-column>
</app-generic-grid>
