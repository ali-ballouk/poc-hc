<h1 class="h3 mb-4">{{ "Invoices" | t }}</h1>
@if (downloadError) {
  <div class="alert alert-danger" role="alert">{{ downloadError | t }}</div>
}
<app-generic-grid
  [data]="rows"
  [actions]="actions"
  [rowId]="rowId"
  [selectable]="false"
  [loading]="loading"
  [label]="'Clinic invoices' | t"
  emptyMessage="No invoices to display."
>
  <app-generic-grid-column
    key="InvoiceId"
    [header]="'Invoice' | t"
    [widthPx]="150"
  ></app-generic-grid-column>
  <app-generic-grid-column
    key="InvoiceDate"
    [header]="'Date' | t"
    type="date"
    [widthPx]="150"
  >
    <ng-template let-invoice>{{
      invoice.InvoiceDate | date: "yyyy-MM-dd HH:mm"
    }}</ng-template>
  </app-generic-grid-column>
  <app-generic-grid-column
    key="DoctorName"
    [header]="'Doctor' | t"
  ></app-generic-grid-column>
  <app-generic-grid-column
    key="PatientName"
    [header]="'Patient' | t"
  ></app-generic-grid-column>
  <app-generic-grid-column
    key="DoctorFee"
    [header]="'Doctor fee' | t"
    type="currency"
    [widthPx]="100"
  ></app-generic-grid-column>
  <app-generic-grid-column
    key="Discount"
    [header]="'Discount' | t"
    type="currency"
    [widthPx]="100"
  ></app-generic-grid-column>
  <app-generic-grid-column
    key="Total"
    [header]="'Total' | t"
    type="currency"
    [widthPx]="50"
  ></app-generic-grid-column>
</app-generic-grid>
