<div class="modal-header">
  <h2 class="modal-title fs-5" id="pos-dialog-title">
    {{ data.title || "Dialog" | t }}
  </h2>
  <button
    type="button"
    class="btn-close"
    (click)="close()"
    [attr.aria-label]="'Close' | t"
  ></button>
</div>
<div class="modal-body">
  <ng-container
    *ngComponentOutlet="data.component; injector: childInjector"
  ></ng-container>
</div>
