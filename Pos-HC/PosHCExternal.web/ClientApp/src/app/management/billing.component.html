<h1 class="h3 mb-3">{{ "Invoices and collections" | t }}</h1>
@if (error) {
  <div class="alert alert-danger" role="alert">{{ error | t }}</div>
}
<form class="d-flex gap-2 mb-3" (ngSubmit)="page = 1; load()">
  <input
    class="form-control"
    [(ngModel)]="search"
    name="search"
    [placeholder]="'Invoice number, patient or doctor' | t"
    [attr.aria-label]="'Search invoices' | t"
  /><button class="btn btn-outline-primary">{{ "Search" | t }}</button>
</form>
<app-generic-grid
  [data]="rows"
  [serverPaging]="true"
  [totalRecords]="total"
  [pageIndex]="page - 1"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  (pageChange)="onPageChange($event)"
  [defaultSort]="sort"
  (sortChange)="onSortChange($event)"
  [columns]="columns"
  [actions]="actions"
  [rowId]="rowId"
  [selectable]="false"
  [loading]="loading"
  [label]="'Invoices' | t"
></app-generic-grid>
