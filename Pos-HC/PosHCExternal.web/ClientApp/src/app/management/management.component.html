<div class="d-flex justify-content-between mb-3">
  <h1 class="h3">{{ definition.title }}</h1>
  @if (canWrite()) {
    <button class="btn btn-primary" (click)="edit()">Add new</button>
  }
</div>
@if (error) {
  <div class="alert alert-danger" role="alert">{{ error }}</div>
}
@if (message) {
  <div class="alert alert-info" role="status">{{ message }}</div>
}
<form class="d-flex gap-2 mb-3" (ngSubmit)="page = 1; load()">
  <input
    class="form-control"
    name="search"
    [(ngModel)]="search"
    placeholder="Search records"
    aria-label="Search all records"
  /><button class="btn btn-outline-primary">Search</button>
</form>
<app-generic-grid
  [data]="rows"
  [columns]="definition.columns"
  [actions]="actions"
  [rowId]="rowId"
  [selectable]="false"
  [loading]="loading"
  [label]="definition.title"
></app-generic-grid>
<div class="d-flex align-items-center gap-3 mt-3">
  <button
    class="btn btn-outline-secondary"
    [disabled]="page === 1 || loading"
    (click)="page = page - 1; load()"
  >
    Previous 50</button
  ><span>{{ total }} records · Page {{ page }}</span
  ><button
    class="btn btn-outline-secondary"
    [disabled]="page * 50 >= total || loading"
    (click)="page = page + 1; load()"
  >
    Next 50
  </button>
</div>
